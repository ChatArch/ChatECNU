site_name: ChatECNU 文档
site_url: https://arch.gh.wzhecnu.cn/ChatECNU/
repo_url: https://github.com/ChatArch/ChatECNU
repo_name: ChatArch/ChatECNU
edit_uri: edit/main/docs/
docs_dir: docs/
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatECNU 文档
        - locale: en
          name: English
          build: true
          site_name: ChatECNU Documentation
          nav_translations:
            首页: Home
            入门: Getting Started
            快速开始: Quickstart
            ChatEnv 变量: ChatEnv Variables
            命令与接口: Commands and Interfaces
            命令树: CLI Tree
            能力地图: Capability Map
            接口树: Interface Tree
            使用指南: Usage Guide
            ECNU 使用: ECNU Usage
extra:
  alternate:
    - name: 中文
      link: /ChatECNU/
      lang: zh
    - name: English
      link: /ChatECNU/en/
      lang: en
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
nav:
  - 首页: index.md
  - 入门:
      - 快速开始: quickstart.md
      - ChatEnv 变量: chatenv.md
  - 命令与接口:
      - 命令树: cli-tree.md
      - 能力地图: capability-map.md
      - 接口树: interface-tree.md
  - 使用指南:
      - ECNU 使用: ecnu.md
