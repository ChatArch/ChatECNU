[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatECNU"
dynamic = ["version"]
description = "ChatArch ECNU campus portal automation CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatstyle>=0.1.0,<0.2.0",
    "chatenv>=0.2.7,<0.3.0",
    "ChatNet>=0.2.0,<0.3.0",
    "requests>=2.0",
    "pycryptodome>=3.0",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatecnu", "chatarch", "ecnu", "campus", "portal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
ecnu = "chatecnu.cli:main"
chatecnu = "chatecnu.cli:main"

[project.entry-points."chatenv.configs"]
ecnu = "chatecnu.config"

[project.entry-points."chatenv.token_refreshers"]
ECNU = "chatecnu.ecnu.session_tokens:refresh_chatenv_token"

[project.urls]
Homepage = "https://github.com/ChatArch/ChatECNU"
Repository = "https://github.com/ChatArch/ChatECNU"
Documentation = "https://arch.gh.wzhecnu.cn/ChatECNU/"

[project.optional-dependencies]
captcha = ["ddddocr", "numpy", "pillow"]
dev = ["build", "pytest", "twine"]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<9.7",
    "mkdocs-static-i18n>=1.2,<2.0",
    "mike>=2.0,<3.0",
]

[tool.setuptools.dynamic]
version = {attr = "chatecnu.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
chatecnu = ["bin/linux-x86_64/auth_client"]
